lab:
  topics:
    replicas: ${LAB_TOPIC_REPLICAS:1}   # 1 for the single-broker tests; the benchmark runner sets 3 for the compose cluster
  tuning:
    f09: false   # F-09: shared ObjectMapper and identifier-only debug logs (baseline: mapper per message, full payloads at INFO)
    f01: false   # F-01: async producer sends with callbacks (baseline: synchronous send().get())
    f04: false   # F-04: batch listener + JDBC batch writes (baseline: one record, one transaction)
    f12: false   # F-12: record key = debtor account id (baseline: merchant id)
spring:
  application:
    name: ledger-service
  profiles:
    active: ${LAB_PROFILE:baseline}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:change-me-local-only}
    hikari:
      schema: ledger
  flyway:
    locations: classpath:db/ledger
    schemas: ledger
    default-schema: ledger
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

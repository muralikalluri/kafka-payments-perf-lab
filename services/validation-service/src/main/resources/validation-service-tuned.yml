# TUNED profile (SPEC.md §3). Each finding adds its own keys below, referencing its F-id.
# Baseline anti-patterns live in *-baseline.yml and must not be changed.
# Profiles are per database: a database migrated by the tuned profile is not reused by baseline
# (run-benchmark.sh resets volumes before every run).

lab:
  admin:
    token: ${LAB_ADMIN_TOKEN:lab-admin-local-only}   # F-13 admin endpoint (lab only); placeholder value
  cache:
    namespace: v1      # F-13: bump to drop every cached entry (key versioning)
    ttl-seconds: 60    # F-13: backstop if an invalidation event is missed
  topics:
    # F-12: 12 partitions on every topic (sizing rationale: docs/adr/0005-partition-sizing.md). Each service
    # sets it because each one's KafkaAdmin creates or grows the shared topics.
    partitions: 12
  tuning:
    # F-12: key by debtor account id. F-08 and F-13 select the projection source / the Redis cache (F-13 needs F-08).
    f08: true
    f12: true
    f13: true

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6390}
      timeout: 100ms          # F-13: fail open quickly when Redis is slow or down
      connect-timeout: 100ms
  kafka:
    listener:
      # F-03: consumer concurrency matched to the partition count (one thread per partition).
      concurrency: 12
    producer:
      # F-01: batch and compress instead of linger.ms=0 / no compression / default batch size.
      compression-type: lz4
      batch-size: 65536
      properties:
        # Validation sends one record per listener call and must wait for the ack before the offset is
        # committed, so lingering would only add latency here: F-01 is compression only in this service.
        linger.ms: 0
  datasource:
    hikari:
      # F-07: pool sized for a 2-CPU Postgres shared by three services, not left at the default with
      # far more threads than connections. Lab choice, not swept; see docs/adr/0004-outbox-and-tuning.md.
      maximum-pool-size: 6
      connection-timeout: 5000
  # F-08: tuned-only migration (account_limits index) in a separate Flyway location and version range.
  flyway:
    locations: classpath:db/validation,classpath:db/validation-tuned
management:
  health:
    redis:
      enabled: true

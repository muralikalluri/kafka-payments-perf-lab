# TUNED profile (SPEC.md §3). Each finding adds its own keys below, referencing its F-id.
# Baseline anti-patterns live in *-baseline.yml and must not be changed.
# Profiles are per database: a database migrated by the tuned profile is not reused by baseline
# (run-benchmark.sh resets volumes before every run).

lab:
  topics:
    # F-12: 12 partitions on every topic (sizing rationale: docs/adr/0005-partition-sizing.md). Each service
    # sets it because each one's KafkaAdmin creates or grows the shared topics.
    partitions: 12
  tuning:
    # F-12: key by debtor account id. F-01 / F-07 flags select async publishing / the gateway outbox.
    f12: true

spring:
  kafka:
    listener:
      # F-03: consumer concurrency matched to the partition count (one thread per partition).
      concurrency: 12
    producer:
      # F-01: batch and compress instead of linger.ms=0 / no compression / default batch size.
      compression-type: lz4
      batch-size: 65536
      properties:
        linger.ms: 10
  datasource:
    hikari:
      # F-07: pool sized for a 2-CPU Postgres shared by three services, not left at the default with
      # far more threads than connections. Lab choice, not swept; see docs/adr/0004-outbox-and-tuning.md.
      maximum-pool-size: 6
      connection-timeout: 5000

lab:
  topics:
    replicas: ${LAB_TOPIC_REPLICAS:1}   # 1 for the single-broker tests; the benchmark runner sets 3 for the compose cluster
  tuning:
    f09: false   # F-09: shared ObjectMapper and identifier-only debug logs (baseline: mapper per message, full payloads at INFO)
    f08: false   # F-08: projection query + Caffeine (baseline: JPA lazy loading, N+1)
    f13: false   # F-13: Redis cache-aside, account.updated invalidation, single-flight (baseline: Postgres every time)
    f12: false   # F-12: record key = debtor account id (baseline: merchant id)
spring:
  application:
    name: validation-service
  profiles:
    active: ${LAB_PROFILE:baseline}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:change-me-local-only}
    hikari:
      schema: validation
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/validation
    schemas: validation
    default-schema: validation
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: validation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${SERVER_PORT:8081}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}   # off unless asked: benchmarks run untraced; tests and demos set 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false   # baseline has no Redis dependency; tuned re-enables it
  metrics:
    tags:
      application: ${spring.application.name}

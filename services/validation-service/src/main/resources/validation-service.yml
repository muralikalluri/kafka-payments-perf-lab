spring:
  application:
    name: validation-service
  profiles:
    active: ${LAB_PROFILE:baseline}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:change-me-local-only}
    hikari:
      schema: validation
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/validation
    schemas: validation
    default-schema: validation
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: validation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# TUNED profile (SPEC.md §3). Each finding adds its own keys below, referencing its F-id.
# Baseline anti-patterns live in *-baseline.yml and must not be changed.
# Profiles are per database: a database migrated by the tuned profile is not reused by baseline
# (run-benchmark.sh resets volumes before every run).

# F-12: key by debtor account id and use 12 partitions (sizing rationale: docs/adr/0005-partition-sizing.md).
# Every service sets this because each one's KafkaAdmin creates or grows the shared topics.
lab:
  topics:
    partitions: 12
  tuning:
    f07: true
    f12: true

# F-03: consumer concurrency matched to the partition count (one thread per partition, single instance).

spring:
  datasource:
    hikari:
      # F-07: pool sized for a 2-CPU Postgres shared by three services, not left at the default with
      # far more threads than connections. Lab choice, not swept; see docs/adr/0004-outbox-and-tuning.md.
      maximum-pool-size: 6
      connection-timeout: 2000
  kafka:
    listener:
      concurrency: 12

# F-06: tuned-only migrations (indexes) in a separate Flyway location and version range (V100+).
  flyway:
    locations: classpath:db/gateway,classpath:db/gateway-tuned

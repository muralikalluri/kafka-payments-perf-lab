lab:
  topics:
    replicas: ${LAB_TOPIC_REPLICAS:1}   # 1 for the single-broker tests; the benchmark runner sets 3 for the compose cluster
  tuning:
    f07: false   # F-07: gateway writes an outbox row instead of sending to Kafka inside the transaction
    f01: false   # F-01: async producer sends with callbacks (baseline: synchronous send().get())
    f12: false   # F-12: record key = debtor account id (baseline: merchant id)
spring:
  application:
    name: payment-gateway
  profiles:
    active: ${LAB_PROFILE:baseline}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:change-me-local-only}
    hikari:
      schema: gateway
  flyway:
    locations: classpath:db/gateway
    schemas: gateway
    default-schema: gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: payment-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

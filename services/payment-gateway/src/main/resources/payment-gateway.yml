lab:
  topics:
    replicas: ${LAB_TOPIC_REPLICAS:1}   # 1 for the single-broker tests; the benchmark runner sets 3 for the compose cluster
  notification:
    webhook-url: ${NOTIFICATION_WEBHOOK_URL:http://localhost:8083/webhooks/{clientId}}
  tuning:
    f10: false   # F-10: virtual threads for the gateway's blocking I/O (baseline: platform threads); JVM flags come from the runner
    f05: false   # F-05: blocking webhook call in the posted listener (tuned: notification-service consumes payments.posted)
    f09: false   # F-09: shared ObjectMapper and identifier-only debug logs (baseline: mapper per message, full payloads at INFO)
    f07: false   # F-07: gateway writes an outbox row instead of sending to Kafka inside the transaction
    f01: false   # F-01: async producer sends with callbacks (baseline: synchronous send().get())
    f12: false   # F-12: record key = debtor account id (baseline: merchant id)
spring:
  threads:
    virtual:
      enabled: ${lab.tuning.f10:false}   # F-10: request threads are virtual only when tuned (baseline: platform threads)
  application:
    name: payment-gateway
  profiles:
    active: ${LAB_PROFILE:baseline}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:change-me-local-only}
    hikari:
      schema: gateway
  flyway:
    locations: classpath:db/gateway
    schemas: gateway
    default-schema: gateway
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: payment-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${SERVER_PORT:8080}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}   # off unless asked: benchmarks run untraced; tests and demos set 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

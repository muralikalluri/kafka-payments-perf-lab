# BASELINE profile: deliberately contains common real-world anti-patterns (see SPEC.md §3).
lab:
  topics:
    partitions: 3          # F-12: only 3 partitions
spring:
  kafka:
    producer:
      # F-01: linger.ms=0, no compression, default batch size (send is also synchronous, see PaymentService)
      compression-type: none
      properties:
        linger.ms: 0
        # F-02: acks=all but ONE in-flight request and NO idempotence (Kafka 3.x clients would otherwise default to
        # idempotence on with five in flight). Ordering is kept, throughput pays, retries can duplicate records.
        enable.idempotence: false
        max.in.flight.requests.per.connection: 1
    listener:
      concurrency: 1       # F-03
  # F-07: Hikari left at defaults (10 connections) against Tomcat's 200 request threads

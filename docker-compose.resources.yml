# Fixed CPU/memory limits so benchmark runs are reproducible.
# Usage: docker compose -f docker-compose.yml -f docker-compose.resources.yml up -d
services:
  kafka-1:
    cpus: 1.0
    mem_limit: 1g
  kafka-2:
    cpus: 1.0
    mem_limit: 1g
  kafka-3:
    cpus: 1.0
    mem_limit: 1g
  postgres:
    cpus: 2.0
    mem_limit: 2g
  redis:
    cpus: 0.5
    mem_limit: 256m
  prometheus:
    cpus: 0.5
    mem_limit: 512m
  grafana:
    cpus: 0.5
    mem_limit: 512m
  kafka-exporter:
    cpus: 0.25
    mem_limit: 128m
  postgres-exporter:
    cpus: 0.25
    mem_limit: 128m

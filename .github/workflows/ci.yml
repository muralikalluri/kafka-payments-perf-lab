name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (baseline profile)
        run: mvn -B verify
      - name: Invariant and pipeline tests (tuned profile)
        run: mvn -B verify -Dlab.profile=tuned -pl services/e2e-tests -am
      - name: Tracing test (Jaeger container, both profiles)
        run: |
          mvn -B verify -Dlab.tracing=true -Dtest=TracingTest -Dsurefire.failIfNoSpecifiedTests=false -pl services/e2e-tests -am
          mvn -B verify -Dlab.profile=tuned -Dlab.tracing=true -Dtest=TracingTest -Dsurefire.failIfNoSpecifiedTests=false -pl services/e2e-tests -am
      - name: Report tooling (no bare numbers in report templates, generated reports are fresh)
        run: |
          python3 scripts/lint_report_numbers.py
          python3 scripts/test_report.py
          python3 scripts/generate_report.py --check
      - name: Validate compose files
        run: docker compose -f docker-compose.yml -f docker-compose.resources.yml config -q
